# The home page cards and the answers behind them.
#
# Lists of apps and services come from IRL Commons (@irl-commons/data), never typed here:
# each block `select`s services by their fields, and the page shows them alphabetically.
#   select: a list of matches; a service is in the block when it fits any of them.
#           In one match every key must fit; a list of values means any of them.
#           Keys: id, class, kind, role, hosting, part, platforms, tags.
#   notes:  optional, one line per service id, used instead of the catalogue description
#           in this block only. A note starting with "'s" follows the name directly.
#           {service-id} in any text becomes a link to that service.
#   before / after: plain lines above or below the services.
# The build fails on a key or value IRL Commons doesn't know, on a tagged service that no
# block with that tag picks up, and on a note for a service the block no longer selects.
#   pre:    optional, a short paragraph above the list.
#   open:   true keeps a block open; the first block is always open.
#   ordered: true numbers the `before` lines (steps to follow). A "! " watch-out takes no number:
#           it sits under the step above it.
#   lead:   a line the services are listed under, as a short list of their own.
#   also:   plain lines below the services, before any `after` lines.
# An answer can have `before` / `after` lines of its own, above the first block or below the last.
# A question page (`question: true`) has `extra` HTML, the question `ask` with an optional `ask_text`
# under it, the `choices`, and optional `side` lines.
#   split:  [ios, android] shows one list per phone platform, with an iPhone/Android switch.
# A line that starts with "! " is a watch-out: it gets the outlined "!" mark and "Watch out:" for screen readers.
# A note that starts with a space follows the service name directly, without a colon.
# `layout: steps` shows the blocks as numbered steps instead of folds; `sub: true` makes a block a
# sub-section of the step before it, with an `anchor` id to jump to. `choose` puts option cards
# (title, text, items, go: {href, label}) side by side.
# Texts are HTML. Link glossary words with class="gl".
# `checked: YYYY-MM-DD` shows "Checked <date> · Report a mistake" under the summary. Set it only when every claim
# on the answer was read against its source that day and no finding is open; a guide page section takes
# data-checked="YYYY-MM-DD" on its <section> for the same line under its h2.
#
# Each answer is a page of its own at <id>.html: list it in site.json pages and run npm run share-images.
# Links between answers are written as "#<id>" here and point to that page once built.
# Each answer page has one back link at the top. Without `back` it says "All starting points"
# and goes to the cards. `back: {to: <answer id>, label: ...}` names the page it goes to.
# `back: history` says "Back" and returns to the answer the visitor came from, or to the cards.
#
# hold_back keeps a catalogue service out of every block on these pages, with the reason. Use it when
# the site can't point to a public page for what the catalogue says, and take it out once it can.

hold_back:
  belabox-cloud-stream-servers: Its features are only described behind a login; no public BELABOX page lists them yet.

groups:
  - title: Start or add something
    cards:
      - {to: one-phone, icon: s-new, title: Not started yet, text: Help me get started streaming IRL}
      - {to: hybrid, icon: s-hybrid, title: Desk and away, text: "Switch between desktop and IRL: hybrid streaming"}
      - {to: better-picture, icon: s-camera, title: A better picture, text: "A standalone camera, like a DSLR"}
      - {to: several-cameras, icon: s-multicam, title: Several cameras, text: Mix phones and cameras in one scene}
  - title: "Live, but something's wrong?"
    style: symptoms
    cards:
      - {to: live-not-on-platform, title: "Phone says live, nobody sees it", text: The platform shows you offline}
      - {to: picture-frozen, title: Picture frozen, text: "Viewers see a still picture"}
      - {to: no-sound-or-alerts, title: No sound or alerts, text: "The picture is fine, the sound isn't"}
      - {to: second-link-idle, title: Second phone or SIM idle, text: "Connected, but the stream doesn't use it"}
  - title: Fix what breaks
    cards:
      - {to: second-network, icon: s-crowd, title: The signal drops, text: "In crowds, on trains or in weak spots"}
      - {to: more, icon: s-hot, title: The phone gives up, text: "It gets too hot, or the battery runs out"}
      - {to: cloud, icon: s-home, title: My home setup fails, text: "My PC, power or internet at home"}
      - {to: satellite, icon: s-far, title: No signal at all, text: "I stream outdoors, far from cell towers"}
  - title: Learn more and get help
    style: learn
    anchor: sims  # old links to the removed "How to pick data plans and SIMs" note land here
    cards:
      - {href: glossary.html, icon: i-book, title: Glossary, text: Look up IRL terms and what they mean}
      - {href: help.html, icon: i-help, title: Help, text: Find guides and help for the apps and services you use}
      - {href: data-plans.html, icon: i-network, title: Data plans and SIMs, text: 'Upload speed, how much data you need, and the limits behind "unlimited"'}
      - {href: why-bonding.html, icon: i-between, title: "Why more than one network?", text: "One network has short bad moments, even a fast one. A second network covers them."}

answers:
  - id: more
    checked: 2026-11-21
    question: true
    icon: s-hot
    title: Keep the phone going
    summary: When heat or an empty battery ends your stream, try these first.
    extra: |
      <div class="cool-tips">
        <h3 id="cool-h">Keep the phone cool and charged</h3>
        <ul class="picks mix tips" aria-labelledby="cool-h">
          <li>Carry a power bank for long streams.</li>
          <li>Keep the phone out of direct sun, and out of bags and pockets where the heat can't get out. <span class="tip-src">Sources: <a href="https://support.apple.com/en-us/118431">Apple</a>, <a href="https://support.google.com/pixelphone/answer/3333708">Google</a>, <a href="https://www.samsung.com/in/support/mobile-devices/what-to-do-when-your-samsung-galaxy-device-heats-up-while-in-use/">Samsung</a></span></li>
          <li>A weak signal makes the phone work harder and get warmer, so a stronger network helps with heat too. <span class="tip-src">Source: <a href="https://www.samsung.com/in/support/mobile-devices/what-to-do-when-your-samsung-galaxy-device-heats-up-while-in-use/">Samsung</a></span></li>
          <li>Lower the resolution, frame rate or <a class="gl" href="glossary.html#bitrate">bitrate</a> in your app. <span class="tip-src">Sources: <a href="https://support.apple.com/en-us/118431">Apple</a>, <a href="https://support.google.com/pixelphone/answer/3333708">Google</a></span></li>
          <li class="w"><span class="vh">Watch out: </span>Charging while streaming adds heat, and heat damages the battery for good. If it gets hot while charging, unplug, let it cool, then charge again. <span class="tip-src">Sources: <a href="https://support.apple.com/en-us/118431">Apple</a>, <a href="https://www.apple.com/batteries/maximizing-performance/">Apple batteries</a>, <a href="https://support.google.com/pixelphone/answer/3333708">Google</a>, <a href="https://www.samsung.com/za/support/mobile-devices/how-to-prevent-the-overheating-of-your-galaxy-device/">Samsung</a></span></li>
          <li>HEVC (H.265) needs less data than H.264 for the same picture, so the phone uploads less. Check first that your receiver and platform accept it: Kick takes only H.264. <span class="tip-src">Sources: <a href="https://support.google.com/youtube/answer/2853702">YouTube</a>, <a href="https://help.kick.com/en/articles/7066931-how-to-stream-on-kick-com">Kick</a></span></li>
        </ul>
        <aside class="soon-card wip-card" aria-labelledby="cool-wip-h">
          <h3 id="cool-wip-h">Extra cooling</h3>
          <p>Tips from other streamers:</p>
          <ul class="bul">
            <li>Small stick-on heatsinks, the kind sold for Raspberry Pi boards, on the phone's hottest spot.</li>
            <li>Clip-on phone coolers.</li>
            <li>Gaming phones, built with extra cooling.</li>
          </ul>
          <p>Where the hot spot is depends on the phone.</p>
        </aside>
      </div>
    ask: Still too hot or too short?
    ask_text: A backpack carries a small streaming computer, mobile modems and a battery, so the phone no longer does that work. Do you want to build and look after one yourself?
    choices:
      - {to: build, icon: a-build, title: "Yes, I'll build it", text: "A small board, modems and a camera."}
      - {to: ready-made, icon: a-ready, title: "No, I'll buy one", text: "Ready to use, with support."}
    side:
      - else: '<strong>Choose something else when</strong> the stream only drops in crowds: <a href="#second-network">a second network</a> is the smaller step.'

  - id: one-phone
    icon: i-phone
    title: One phone is enough
    summary: "A phone with a streaming app has everything a stream needs: camera, mic, mobile data and the app that sends it. Start with it, and add parts only when something stops working."
    blocks:
      - title: Your first stream
        ordered: true
        before:
          - "Install a streaming app from the list below. Log in to your platform in the app, or copy the stream address and stream key from the platform's creator dashboard."
          - "! Keep the stream key secret. Anyone who has it can go live on your channel."
          - "! On YouTube, switch on live streaming a day early. The first time can take up to 24 hours."
          - Test at home with Wi-Fi off, and watch on a second device.
      - title: Streaming apps
        open: true
        count: [app, apps]
        select: [{class: phone-app}]
        split: [ios, android]
      - title: Good to have
        open: true
        before:
          - A power bank, in case your phone runs empty.
          - "! Unplug it when the phone gets hot: charging adds heat."
          - "A wireless mic. A lot of people add one for their IRL streams: the phone's own mic picks up wind and crowds, and loses your voice at arm's length."
          - "! Many mic receivers plug into the phone's charging port. Check that yours lets you charge at the same time."
    side:
      - next: '<strong>Check your data plan.</strong> An hour at 6 Mbit/s uses about 2.7 GB: <a href="data-plans.html">Data plans and SIMs</a>.'
      - else: '<strong>Choose something else when</strong> crowds, long days or heat end your streams: <a href="#second-network">add a second network</a>, or <a href="#more">think about a backpack</a>.'

  - id: second-network
    icon: i-network
    title: Add a second network
    summary: 'Add a second internet connection on a different mobile network, and let your streaming app use both at once. That''s called <a class="gl" href="glossary.html#bonding">bonding</a>. If one network has a bad moment, the other can carry the stream.'
    layout: steps
    blocks:
      - title: Get a second connection
        before:
          - "A second phone's hotspot, on a different network: if you have a spare phone."
          - "A pocket 5G hotspot with a SIM on a different network: if you don't."
          - 'Two SIMs mean two data plans: see <a href="data-plans.html">Data plans and SIMs</a>.'
      - title: Bond them
        before:
          - 'Use an app that bonds: Moblin, IRL Pro, IRL+ Cast, LifeStreamer, IRLwhatever or TVU Go. See <a href="#one-phone">the phone apps</a>.'
        lead: "Or a helper that bonds for your app or adds spare phones:"
        select: [{role: extra-connections, platforms: [android, ios]}]
        after:
          - "! Without bonding, a hotspot isn't combined with the phone's mobile data."
          - '! SRTLA bonding also needs a <a href="#receiver">receiver</a>. Some apps include one; if yours doesn''t, pick a receiver.'
      - title: Test it
        before:
          - "! Connected isn't enough: during a test stream, each connection should show traffic."
    side:
      - else: '<strong>Choose something else when</strong> you need many networks, or a standalone camera on your back: <a href="#more">think about a backpack</a>.'
      - next: '<strong>Why it works:</strong> <a href="why-bonding.html">Why more than one network?</a>'

  - id: build
    checked: 2026-11-21
    back: {to: more, label: Build or buy}
    icon: a-build
    title: Build your own backpack
    summary: You put the backpack together from parts and run one of these systems on it. You choose every part, and you set it up and fix it yourself.
    blocks:
      - title: Systems you build yourself
        count: [system, systems]
        select: [{id: [belabox, ceralive, irlbox]}]
      - title: What you need
        open: true
        before:
          - A small computer board.
          - Two or more modems with SIMs on different networks.
          - A way to connect your camera, such as an HDMI capture device or a USB camera.
          - A battery that lasts the whole stream.
          - 'If it bonds with SRTLA: a <a href="#receiver">receiver</a> for the bonded stream.'
          - "! Check the system's list of supported boards and modems before you buy. Not every part works."
    side:
      - else: '<strong>Choose something else when</strong> it has to work right away, with support: <a href="#ready-made">ready-made backpacks</a>.'
      - next: '<strong>Picking SIMs?</strong> <a href="data-plans.html">Data plans and SIMs</a>.'

  - id: ready-made
    back: {to: more, label: Build or buy}
    icon: a-ready
    title: A ready-made backpack, with support
    summary: Ready to use when it arrives. Some fit in a backpack, others mount on the camera. Rentals and warranties depend on the package.
    blocks:
      - title: Who makes them
        count: [maker, makers]
        select: [{id: [liveu-solo, unlimitedirl, yolobox-ultra, teradek-prism-mobile, tvu-one, haivision-pro, dejero-engo]}]
        also:
          - "Many charge a monthly fee for their bonding service on top of the device. Ask what it includes: data, the service, or both."
    side:
      - else: '<strong>Choose something else when</strong> your phone already does what you need but the connection drops: <a href="#second-network">add a second network</a>.'

  - id: better-picture
    icon: s-camera
    title: A standalone camera
    summary: "A mirrorless camera or DSLR gives a cleaner picture in low light, optical zoom and a soft background. An action camera is small, wide and steady. Either hands its picture over HDMI, USB or Wi-Fi to something that streams it: your phone, a backpack, or a box on the camera."
    blocks:
      - title: Before you add a camera
        small: power, heat, hands, sound
        before:
          - "<strong>Power.</strong> The camera has to run for the whole stream. Some run from USB-C power; others need a dummy battery, a battery-shaped adapter on a cable to a power bank."
          - "! A capture adapter draws from the phone, so the phone empties faster."
          - "! <strong>Heat.</strong> Some cameras get too hot and switch themselves off, sooner in the sun. Run yours at home for as long as you plan to stream, and turn off auto power-off."
          - "! <strong>Clean picture.</strong> Look for \"clean HDMI\" in the camera's menu or specs. Without it, viewers see the camera's focus boxes and icons."
          - "<strong>Hands.</strong> Filming, talking and reading chat at once is hard. An action camera, or a phone, on a chest mount keeps your hands free. A bigger camera needs a mount, a gimbal or someone to run it."
          - "<strong>Sound into the camera.</strong> The mic plugs into the camera, and the sound travels with the picture over HDMI, in sync."
          - "! Check that your app or backpack uses the camera's sound. Not all do."
          - "<strong>Sound into the phone or backpack.</strong> A USB mic or audio adapter plugs into the phone or the backpack. Easy to swap mics."
          - "! The picture arrives later than the sound on this route, so set an audio delay in the app or backpack."
      - title: Into your phone
        count: [app, apps]
        select: [{class: phone-app, tags: camera-in}]
        notes:
          moblin: 'on iPad, takes USB-C cameras. On iPhone, a camera that streams over Wi-Fi can send to Moblin''s <a class="gl" href="glossary.html#local-ingest">local ingest</a>.'
          irlplus-cast: for Android, in open testing, takes USB and network cameras.
          lifestreamer: "for Android, with USB video in. With {mediasrvr}, an action camera can send its picture to the phone."
          irlwhatever: for Android, in open beta, takes USB cameras.
        after: [An HDMI camera needs an HDMI-to-USB capture adapter to plug into a phone. A camera with a USB webcam mode plugs in without one.]
      - title: In a backpack
        small: build or buy
        pre: 'A backpack takes the camera''s HDMI and streams it over several mobile modems. Your phone stays free for chat. <a href="#build">Build one</a> or <a href="#ready-made">buy one</a>.'
      - title: On the camera
        count: [maker, makers]
        pre: "An encoder that takes the camera's HDMI and streams over its own modems or SIM cards, without a phone."
        select: [{class: hardware, tags: camera-in}]
        notes:
          teradek-prism-mobile: an encoder on the back of the camera that bonds; by subscription or licence.
          yolobox-ultra: an all-in-one box with a screen and HDMI inputs; bonding is a paid service.
          liveu-solo: bonded encoders for creators. Bonding is a subscription ($45/month); one connection works without.
    side:
      - else: '<strong>Choose something else when</strong> the picture is fine but heat or the battery ends it: <a href="#more">the phone gives up</a>.'
      - next: '<strong>Next:</strong> to show the camera and your phone together, see <a href="#several-cameras">several cameras</a>.'

  - id: several-cameras
    icon: s-multicam
    title: Several cameras in one scene
    summary: "Something has to put the pictures together: an app on the phone, OBS on a PC or server, a hub in the cloud, or a box in your backpack."
    blocks:
      - title: On the phone
        count: [app, apps]
        pre: When your phone app can show those cameras.
        select: [{class: phone-app, tags: multi-camera}]
        notes:
          moblin: "for iPhone, shows several of the phone's cameras at once, picture-in-picture. Also takes streams from other phones and cameras into a scene."
          irlwhatever: for Android, in open beta, phone and USB cameras in scenes with picture-in-picture.
      - title: In OBS, at home or anywhere
        count: [tool, tools]
        pre: When you mix on a computer, at home or on a server.
        select: [{class: production, tags: multi-camera}, {id: moblin}]
        notes:
          obs-studio: each phone or camera is its own source. Runs on your PC or on a server, so it works away from home too.
          moblin: "'s Mobcam: an iPhone as a webcam over USB."
          vdo-ninja: a phone becomes a camera in OBS, from its browser.
      - title: In the cloud
        count: [service, services]
        pre: When the show has to keep running if your PC at home fails.
        select: [{class: cloud, tags: multi-camera}]
        notes:
          irlhosting: cloud OBS servers for IRL streamers, with SRTLA bonding and drop protection.
      - title: In the backpack
        count: [add-on, add-ons]
        pre: When you mix while you're out.
        select: [{class: parts, tags: multi-camera}]
    after:
      - "! Each phone or camera arrives with its own delay. Line them up where you mix, before you go live."
      - "! Each feed brings its own sound. Take the audio from one and mute the others, or viewers hear echoes."
    side:
      - else: '<strong>Choose something else when</strong> you switch between places instead of showing them together: <a href="#hybrid">Desktop and IRL</a>.'

  - id: cloud
    icon: a-cloud
    title: Move the hub to the cloud
    summary: With the hub on a rented server, your away stream keeps running even if the PC, power or internet at home fails. The hub is OBS on that server, or a hosted service.
    blocks:
      - title: Cloud hubs
        select: [{class: cloud}, {id: [obs-studio, noalbs-tool]}]
        notes:
          irlhosting: cloud OBS servers for IRL streamers, with SRTLA bonding and disconnect protection.
          obs-studio: " on a server you rent: the OBS you know."
        also:
          - The server or the hosted service costs a monthly fee; OBS itself is free.
          - "! If you also send your desktop, pick a hub or plan with a second input for it."
          - "! Going live in your app only feeds the hub. Before your first stream, check how your hub goes live on the platform."
    side:
      - else: "<strong>Choose something else when</strong> most of your streams are at your desk and your PC is reliable."
      - next: '<strong>Next:</strong> if your hub runs OBS, <a href="#into-obs">get the stream into OBS</a>.'

  - id: hybrid
    icon: a-hybrid
    title: Desktop and IRL in one stream
    summary: 'To switch between desktop and IRL without ending your stream, send both to a <strong><a class="gl" href="glossary.html#hub">hub</a></strong>: a server or an OBS instance that lets you switch between different sources. Only the hub goes live on Twitch, YouTube or Kick.'
    layout: steps
    blocks:
      - title: Pick where the hub runs
        choose:
          - title: On your PC at home
            text: Free. Good when you already stream from OBS at your desk and your PC and home internet are reliable.
            items:
              - "! Your PC, power and home internet have to stay on the whole time."
              - "! Your phone, and any remote app, need a way in to your home from outside."
            go: {href: "#hybrid-home", label: Set up the hub at home}
          - title: In the cloud
            text: A monthly fee. Good when you're away for long, or your home internet or power isn't reliable.
            items:
              - "! At the desk, your PC sends to the hub too, so the hub needs two inputs. Check the plan."
            go: {href: "#hybrid-cloud", label: Pick a cloud hub}
      - title: "Hub at home: OBS on your PC"
        sub: true
        anchor: hybrid-home
        before:
          - Your desk OBS can be your hub. Add the phone as one more source and build a phone scene around it.
          - On the same Wi-Fi at home, the phone can send straight to OBS.
          - '! Away from home, your router blocks a stream coming in. Send it to a <a class="gl" href="glossary.html#relay">receiver</a> that OBS pulls from: see <a href="#receiver">receivers</a> and <a href="#into-obs">into OBS</a>.'
          - "! A mic set in OBS's Settings → Audio plays in every scene. Add your desk mic to the desk scenes only, or viewers hear your empty room while you're away."
      - title: Hub in the cloud
        sub: true
        anchor: hybrid-cloud
        select: [{id: [irlhosting, irltoolkit, obs-studio]}]
        notes:
          irlhosting: '<a class="gl" href="glossary.html#cloud-obs">cloud OBS</a> servers, with SRTLA bonding and <a class="gl" href="glossary.html#drop-protection">drop protection</a>.'
          irltoolkit: cloud production with overlays and drop protection. Desk plus phone needs the plan with several inputs.
          obs-studio: " on a server you rent: the OBS you know. You can import your scene collection from home."
        after:
          - "! Going live in your app only feeds the hub. Before your first stream, check how your hub goes live on the platform, and whether its input has to be switched on."
      - title: Make three scenes in the hub
        pre: 'A <a class="gl" href="glossary.html#scene">scene</a> is one saved layout of what viewers see. Switching scenes changes the whole picture at once.'
        before:
          - "<strong>Desktop:</strong> your screen or game capture, plus your webcam."
          - "<strong>Phone:</strong> the stream coming in from your phone or backpack."
          - '<strong><a class="gl" href="glossary.html#brb">BRB</a>:</strong> a picture, for when the phone''s signal drops or you take a break.'
      - title: Send to the hub from where you are
        pre: "In your phone app or backpack, enter the hub's or receiver's address instead of the platform's."
        before:
          - 'One phone, to start: see <a href="#one-phone">the phone apps</a>.'
          - 'A phone with a second network, for crowds and trains: see <a href="#second-network">a second network</a>.'
          - 'A backpack, for a standalone camera or long days: <a href="#more">build or buy one</a>.'
      - title: Switch scenes while you are away
        before:
          - "! Remote apps connect straight to OBS. A cloud OBS works from anywhere; OBS at home needs a way in, like the stream."
          - Chat commands need no way in, and a mod can type them for you.
        select: [{tags: scene-control}]
        notes:
          irlplus-chat: an Android chat manager with OBS control.
          irlwhatever: OBS scene switching from the app you stream with, and a browser remote.
          moblin: changes OBS scenes, starts and stops the stream and mutes inputs, from the app you stream with.
          noalbs-tool: switches to your BRB scene by itself when the signal drops, and back. Takes chat commands.
          noalbs-cloud: the hosted NOALBS, with a phone dashboard and chat commands.
          obs-blade: a remote for OBS on iPhone, iPad and Android.
          streamer-bot: switches scenes from chat commands or a Stream Deck; runs on the Windows PC next to OBS.
        after: ['Guide: <a href="https://obsproject.com/kb/remote-control-guide">OBS''s Remote Control Guide</a>.']
      - title: During the stream
        before:
          - "Leaving the desk: go live in the phone app, check that the hub shows the phone's picture, then switch to the phone scene."
          - "! Coming back: switch to the desktop scene first, then stop the phone app. The other way round, viewers see a frozen picture or BRB."
          - '! When the phone''s signal drops, drop protection shows your BRB scene instead of a frozen picture. Set it up once: see <a href="#into-obs">into OBS</a>.'
    side:
      - else: '<strong>Choose something else when</strong> you want desk and phone on screen at the same time: <a href="#several-cameras">several cameras</a>.'
      - next: '<strong>Next:</strong> a phone that bonds sends to a <a href="#receiver">receiver</a> first, and the hub takes the stream from there. Most hosted hubs include one.'

  - id: receiver
    back: history
    icon: i-receiver
    title: A receiver for your bonded stream
    summary: Bonding splits your stream over several connections. A receiver is the server that joins it back together before OBS or the platform. Some apps and cloud hubs include one. If yours doesn't, pick one here.
    before:
      - "! Pick one that supports your app's or backpack's bonding protocol."
    blocks:
      - title: Hosted
        count: [service, services]
        pre: A service runs it for you, often for a fee.
        select: [{class: bonding, hosting: service}]
      - title: Run your own
        count: [receiver, receivers]
        open: true
        pre: Free software, but you look after the server.
        select: [{class: bonding, hosting: self}]
        after:
          - "! It needs a server, or a PC at home that your phone or backpack can reach from the internet. At home that means port forwarding, which some internet connections don't allow."
    side:
      - next: '<strong>Next:</strong> <a href="#into-obs">get the stream into OBS</a>.'

  - id: into-obs
    back: history
    icon: a-chain
    title: Into OBS
    summary: Your app or backpack sends the stream to a receiver. OBS takes it from there. Start Streaming in OBS is what goes live.
    blocks:
      - title: In OBS
        before:
          - "Add the receiver's address to OBS as a source, not the phone's."
          - "! After a dropout, OBS's own media source can glitch or lose audio sync until you restart it. A source made for IRL, such as {obs-irl-source} or {smooth-media-source} (Windows), reconnects on its own."
          - A scene switcher like {noalbs-tool} shows your BRB scene when the bitrate drops, and switches back when it recovers.
          - Make a BRB scene, then cut a test feed to check the switch away and back.
          - '! The switcher reads the receiver''s <a class="gl" href="glossary.html#stats-url">stats URL</a>, which isn''t the address OBS plays.'
          - "! Use one automatic switcher per OBS: two fight over the scenes."
      - title: Hosted drop protection
        count: [service, services]
        pre: "These switch to BRB for you. Pick one that works with your OBS to keep your scenes, or one that runs the whole show if you don't want OBS."
        select: [{class: cloud}]

  - id: satellite
    checked: 2026-11-21
    icon: i-satellite
    title: Add a satellite dish
    summary: Satellite internet works far from cell towers. Use it on its own where there's no mobile signal, or as one more connection where mobile networks are busy.
    blocks:
      - title: Satellite internet
        select: [{class: connections, platforms: hardware}]
        notes:
          starlink: satellite internet, as one more link for a phone setup or a backpack.
        also:
          - "! The dish needs a clear view of the sky. Trees and buildings block it."
          - "! It needs power for the whole stream: plan a big battery."
          - "! Using it while moving needs a Roam or Priority plan, used where Starlink allows it, and a dish made for motion (Mini, Standard or Performance), fixed in place. Residential plans don't allow it."
          - 'To use it together with mobile networks, your app or backpack has to bond, and SRTLA needs a <a href="#receiver">receiver</a>.'
    side:
      - else: '<strong>Choose something else when</strong> you only lose signal in crowds or weak spots: <a href="#second-network">a second network</a> is the smaller step.'

  # "Live, but something's wrong?": the four questions asked most, each a few checks in the order worth trying.
  - id: live-not-on-platform
    checked: 2026-11-21
    icon: a-chain
    title: "Live in the app, but nobody sees it"
    summary: 'Your app may not send to the platform itself. Often it sends to a <a class="gl" href="glossary.html#hub">hub</a> first: a receiver, a cloud OBS or OBS at home. Then the hub goes live on the platform, with its own start.'
    layout: steps
    blocks:
      - title: Find out where your app sends
        before:
          - "Look at the address in your app's stream settings. Is it your platform's, or your hub's?"
          - "Straight to the platform: compare the server address and stream key with the ones in the platform's dashboard."
          - "! Keep the stream key secret, also in screenshots you send for help."
      - title: Start the hub
        before:
          - "OBS, at home or on a server: press Start Streaming."
          - "A cloud service: start its output too. IRLToolkit's Cloud OBS has a Start button, and NoDrop starts with the /startstream command."
          - "! A cloud destination switches itself off after the platform refuses it, for example after you changed your stream key. Fix the key, then switch the destination back on."
      - title: Watch what arrives
        before:
          - "Run a short test and watch the platform's own dashboard. It shows whether a stream arrives."
    after:
      - "Still stuck? Before you ask for help, note your app and its version, your phone, the network and the time it happened. Blank out your stream key in screenshots."
    sources:
      - {label: "IRLToolkit: Cloud OBS quick start", url: "https://kb.irltoolkit.com/cloudobs/0-QuickStart"}
      - {label: "IRLToolkit: NoDrop quick start", url: "https://kb.irltoolkit.com/nodrop/0-QuickStart"}
      - {label: "IRLToolkit: no destination enabled", url: "https://kb.irltoolkit.com/cloudobs/1-Troubleshooting/NoDestEnabled"}

  - id: picture-frozen
    checked: 2026-11-21
    icon: s-camera
    title: "The picture froze, but you're still live"
    summary: "Something between the camera and your viewers stopped while the stream kept going. Find out which part: the camera's link to the phone, or the feed into OBS."
    layout: steps
    blocks:
      - title: Look at the preview on the phone
        before:
          - "Frozen there too: the camera or its link to the phone stopped. With a Wi-Fi camera, bring it closer to the phone and restart the camera's live mode."
          - "Moving on the phone: the phone and the camera are fine. Look further along."
      - title: Look at the feed into OBS
        before:
          - "If your receiver shows the stream arriving, the source in OBS is what's stuck."
          - 'In NOALBS, press Fix feed or type !fix in chat. It reconnects the media sources in the scene on air. See <a class="gl" href="glossary.html#fix-feed">fix feed</a>.'
          - "! OBS's own media source can stay stuck after a dropout. A source made for IRL, such as {obs-irl-source} or {smooth-media-source} (Windows), reconnects on its own."
    after:
      - "Still stuck? Before you ask for help, note your app and its version, your phone, the network and the time it happened. Blank out your stream key in screenshots."
    sources:
      - {label: "NOALBS: troubleshooting", url: "https://docs.noalbs.com/guides/troubleshooting/"}
      - {label: "OBS IRL Source README", url: "https://github.com/irlserver/obs-irl-source"}

  - id: no-sound-or-alerts
    checked: 2026-11-21
    icon: s-silent
    title: "No sound, or the alerts are gone"
    summary: 'The picture is fine, so follow the sound from where it starts: the mic, then your app, then OBS. Alerts are web pages inside OBS, and they only play while they are loaded.'
    layout: steps
    blocks:
      - title: Check the mic
        before:
          - "Check that the mic is plugged in and picked as the input in your app, and that its level moves when you speak."
          - '! A scene can switch to another mic. In Moblin that''s a scene''s Override setting (a <a class="gl" href="glossary.html#mic-override">mic override</a>). Check the mic of the scene you''re in.'
      - title: Check OBS
        before:
          - "In the audio mixer, check that the source with your stream isn't muted."
          - "! After a dropout, OBS's own media source can lose the sound until you restart it. A source made for IRL, such as {obs-irl-source}, recovers on its own."
      - title: Check the alerts
        before:
          - 'Alerts are a <a class="gl" href="glossary.html#browser-source">browser source</a> in OBS. It has to be in the scene that''s live, and visible.'
          - '! With "Shutdown source when not visible" on, OBS unloads the page while the source is hidden or in another scene. It''s off by default.'
          - 'To reload the alerts each time a scene goes live, switch on "Refresh browser source when scene becomes active". It''s off by default too.'
    after:
      - "Still stuck? Before you ask for help, note your app and its version, your phone, the network and the time it happened. Blank out your stream key in screenshots."
    sources:
      - {label: "Moblin: scene settings (source code)", url: "https://github.com/eerimoq/moblin/blob/main/Moblin/View/Settings/Scenes/Scene/SceneSettingsView.swift"}
      - {label: "OBS IRL Source README", url: "https://github.com/irlserver/obs-irl-source"}
      - {label: "OBS: browser source", url: "https://obsproject.com/kb/browser-source"}

  - id: second-link-idle
    checked: 2026-11-21
    icon: i-network
    title: "The second connection carries nothing"
    summary: "Connected isn't the same as carrying. Either your app isn't bonding over that connection, or your receiver can't be reached over it."
    layout: steps
    blocks:
      - title: Check that your app bonds
        before:
          - 'Bonding has to be on in your app, and the app should list every connection. A hotspot on its own adds a network, not bonding: see <a href="#second-network">Add a second network</a>.'
          - "During a test stream, look at each connection's traffic. Zero on one means it isn't helping yet."
      - title: Check the connection itself
        before:
          - "Turn off any VPN on the phone that gives the connection. Your receiver has to be reachable over it."
          - "! With SRTLA, your app stops using a connection when the receiver hasn't answered on it for about 4 seconds."
          - 'A hotspot from an Android phone: in Moblin, turn off <a class="gl" href="glossary.html#big-packets">Big packets</a> in the stream''s SRT settings. Moblin notes that some Android hotspots don''t work with them.'
          - "A spare phone with Moblink: turn off energy saving on that phone, and allow Moblink's notifications."
    after:
      - "Still stuck? Before you ask for help, note your app and its version, your phone, the network and the time it happened. Blank out your stream key in screenshots."
    sources:
      - {label: "SRTLA sender (source code)", url: "https://github.com/BELABOX/srtla/blob/main/srtla_send.c"}
      - {label: "Moblin: SRT settings (source code)", url: "https://github.com/eerimoq/moblin/blob/main/Moblin/View/Settings/Streams/Stream/Srt/StreamSrtSettingsView.swift"}
      - {label: "Moblink README", url: "https://github.com/eerimoq/moblink"}
