# What each page in content/ needs around its text: the head, the header and the footer.
# The answer pages get theirs from content/setup.yaml (answer_meta in scripts/setup.py).
#
#   title, description  the browser tab, search results and link previews
#   lang                en (the default) or de
#   alternate           the same page in the other language
#   section             the top navigation item this page belongs under, when it isn't one itself
#   next                the page the pager at the bottom points to, and its label
#   illustrations       which drawings the page uses: home, guide or help
#   stylesheet          a second stylesheet after assets/style.css
#   share               site: use the site's share card instead of one of its own (scripts/share.py)
#   share_icon          the drawing on the page's share card, where the page has none of its own
#   share_line          the line on the share card, where the page's own first sentence is too long
#   category            fix, guide or tip for the badge (scripts/category.py), where the folder or section doesn't say

index.html:
  title: How to IRL · Help for IRL streaming
  description: "For streamers and helpers that stream IRL or hybrid: guides, a glossary and an open list of apps and services."
  illustrations: home
  share_icon: a-pack

help.html:
  title: Help · How to IRL
  description: Where to get help for the apps in your IRL stream, and guides for them.
  illustrations: help

glossary.html:
  title: Glossary · How to IRL
  description: Words you will meet around IRL streaming, explained in plain language.
  illustrations: guide
  next: {href: index.html, label: How to IRL}

data-plans.html:
  title: Data plans and SIMs · How to IRL
  description: 'What to look for in a data plan or SIM for an IRL stream: upload speed, how much data a stream uses, the limits behind "unlimited", coverage maps, testing a spot, and roaming abroad.'
  section: help.html
  illustrations: guide
  next: {href: links.html, label: Apps and services}

why-bonding.html:
  title: Why more than one network? · How to IRL
  description: Why one modem or phone, even a fast one, isn't enough for an IRL stream, how a second network helps, and what bonding can't fix.
  section: help.html
  illustrations: guide
  next: {href: data-plans.html, label: Data plans and SIMs}

something-wrong.html:
  title: Find what broke while you're live · How to IRL
  description: When your IRL stream misbehaves, follow it from the camera to your viewers, find the part that stopped, and know what to note before you ask for help.
  section: help.html
  illustrations: guide
  next: {href: protocols.html, label: "RTMP, SRT or SRTLA?"}

protocols.html:
  title: RTMP, SRT or SRTLA? · How to IRL
  description: What RTMP, SRT and SRTLA each do, which one fits your connection, caller and listener, three working setups into OBS, and how to pick SRT latency.
  section: help.html
  illustrations: guide
  next: {href: power.html, label: "Power, and taking power banks on a flight"}

power.html:
  title: Power, and taking power banks on a flight · How to IRL
  description: How long a power bank really runs your IRL stream, measuring your setup's draw, USB-C cables and voltages, and the rules for taking power banks on a flight.
  section: help.html
  illustrations: guide
  next: {href: help.html, label: Help}

phone-setup.html:
  title: How to IRL stream with your phone · How to IRL
  description: "Stream IRL with just your phone: the app, a private test before you go public, adding a second connection with bonding, and a test that proves the second connection carries your stream."
  section: help.html
  illustrations: guide
  next: {href: protocols.html, label: "RTMP, SRT or SRTLA?"}

fix.html:
  title: Something not working? · How to IRL
  description: "Trying to stream and something isn't working: the problems asked most, each with its checks in order and a link to send to whoever helps you."
  illustrations: home
  share_icon: i-q

tips.html:
  title: Tips · How to IRL
  description: Short tips for IRL streaming, one thing per page, with their sources.
  illustrations: guide
  share_icon: i-list

tips/wifi-off-test.html:
  title: Test your stream with Wi-Fi off · How to IRL
  description: "Turn Wi-Fi off in your phone's Settings before a test at home, so the test runs on mobile data. Watch it on a second device."
  section: tips.html
  illustrations: guide
  share_icon: i-network

tips/twitch-test-mode.html:
  title: Test on Twitch without going live · How to IRL
  description: "Add ?bandwidthtest=true after your Twitch stream key: Twitch takes the stream without showing it, and Twitch Inspector shows its bitrate. Take it out before the real stream."
  section: tips.html
  illustrations: guide
  share_icon: i-tick

tips/clap-sync.html:
  title: Clap once to check your sound is in sync · How to IRL
  description: "Clap once on camera and watch your second device with headphones on. You should hear the clap when your hands meet."
  section: tips.html
  illustrations: guide
  share_icon: s-silent
  share_line: Clap once on camera. You should hear the clap when your hands meet.

tips/wave-and-count.html:
  title: Wave and count to see your delay · How to IRL
  description: "Wave at the camera and count the seconds until the wave shows up on your second device: roughly your delay to that screen."
  section: tips.html
  illustrations: guide
  share_icon: i-between

tips/wipe-the-lens.html:
  title: Hazy picture? Wipe the lens · How to IRL
  description: "A smudge on the lens can make lights glow and blur. Wipe it with a clean lens cloth and look at the same view again."
  section: tips.html
  illustrations: guide
  share_icon: i-phone

tips/watch-the-mic-meter.html:
  title: Say one line and watch the mic meter · How to IRL
  description: "Say one normal sentence and watch the mic meter in your app. The bar should move with your words."
  section: tips.html
  illustrations: guide
  share_icon: i-tick

tips/power-bank-idle.html:
  title: Test your power bank with the camera idle · How to IRL
  description: "Some power banks shut off when a camera uses very little power. Check that yours keeps powering the camera while it sits idle."
  section: tips.html
  illustrations: guide
  share_icon: i-checklist

tips/plug-in-before-live.html:
  title: Plug everything in before you go live · How to IRL
  description: "Some multiport power banks cut power for a moment when a second device is plugged in or unplugged. Plug everything in first."
  section: tips.html
  illustrations: guide
  share_icon: i-checklist

tips/check-the-local-preview.html:
  title: Frozen on stream? Look at your own preview · How to IRL
  description: "Viewers see a frozen picture? Look at the preview on the phone you stream from, to see where to look next."
  section: tips.html
  illustrations: guide
  share_icon: s-camera
  share_line: Look at the preview on the phone you stream from while something moves in front of it.

links.html:
  title: Apps and services · How to IRL
